services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8000"
    volumes:
      - .:/app
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./flowgrok.db}
      - REDIS_URL=redis://redis:6379/0

  local-agent-test:
    image: flowgrok-be-api
    profiles:
      - local-agent-test
    env_file:
      - .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - .:/app
    command: uvicorn app.local_agent.main:app --host 0.0.0.0 --port 8765
    environment:
      - FLOWGROK_LOCAL_PROFILE_ID=${FLOWGROK_LOCAL_PROFILE_ID:-test-local-grok}
      - FLOWGROK_LOCAL_PROFILE_NAME=${FLOWGROK_LOCAL_PROFILE_NAME:-Test Local Grok}
      - FLOWGROK_LOCAL_API_KEY=${FLOWGROK_LOCAL_API_KEY:-}

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-flowgrok}
      - POSTGRES_USER=${POSTGRES_USER:-flowgrok}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flowgrok_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowgrok} -d ${POSTGRES_DB:-flowgrok}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
